name = "plpcjf"
compatibility_date = "2024-01-01"
pages_build_output_dir = ".svelte-kit/cloudflare"
compatibility_flags = ["nodejs_compat"]

# Configuração de ambientes
# Desenvolvimento - usa o bucket remoto (não local)
[[r2_buckets]]
binding = "LOUVORES_BUCKET"
bucket_name = "pls-louvores"
preview_bucket_name = "pls-louvores"

# Produção
[env.production]
compatibility_flags = ["nodejs_compat"]
[[env.production.r2_buckets]]
binding = "LOUVORES_BUCKET"
bucket_name = "pls-louvores"

# O checksum do manifest NÃO mora mais aqui.
#
# Ele é publicado pela app admin (admin.plpcg.com) como objeto no R2, na chave
# `louvores-manifest.sha256`, ao lado do próprio manifest — e lido de lá por
# src/routes/louvores-manifest.sha256/+server.js.
#
# Motivo: este arquivo é a fonte da verdade para env vars do Pages ("your Wrangler
# file is the source of truth" — docs da Cloudflare), então qualquer valor que a
# admin escrevesse via API do Pages era desfeito no deploy seguinte daqui. Era por
# isso que a atualização automática do catálogo nunca funcionou.
#
# Não reintroduza LOUVORES_MANIFEST_CHECKSUM aqui nem no painel.

# JWT_SECRET será configurado via wrangler secret (NÃO coloque aqui!)
# Use: wrangler secret put JWT_SECRET (para dev)
# Use: wrangler secret put JWT_SECRET --env production (para produção)

