# Worker `louvores-worker-production`.
#
# Ele atende /louvores-manifest.json, /assets/**.pdf e POST /api/upload-louvor,
# e repassa todo o resto (`fetch(request)`) para o Cloudflare Pages.
#
# A rota era `*plpcg.com/*` — o curinga pegava a zona inteira, inclusive o apex,
# e rodava ANTES do Pages. Os handlers equivalentes em src/routes/ e em
# src/hooks.server.js, que são os mantidos, nunca eram alcançados em plpcg.com.
#
# A rota foi estreitada para `*.plpcg.com/*` (só subdomínios): o apex passou a
# ser servido pelo Pages, acabando com a duplicação onde ela custava caro.
# O Worker continua necessário porque v2.plpcg.com e 120826.plpcg.com servem
# /assets/**.pdf e NÃO têm binding de R2 — só funcionam através dele.
#
# Enquanto esses dois existirem, a regra de correspondência de chave tem de
# valer nos dois caminhos: por isso ela é importada de src/lib/server/, e não
# copiada. Aposentar v2 e 120826 permite apagar este Worker de vez.
#
# O código deste Worker só existia na Cloudflare até 2026-08-31; foi
# recuperado da API e trazido para cá para não se perder de novo.

name = "louvores-worker"
main = "index.js"
compatibility_date = "2024-01-01"

[env.production]
routes = [{ pattern = "*.plpcg.com/*", zone_name = "plpcg.com" }]

[[env.production.r2_buckets]]
binding = "LOUVORES_BUCKET"
bucket_name = "pls-louvores"

# JWT_SECRET é secret, definido via `wrangler secret put JWT_SECRET --env production`.
# Enquanto não existir, POST /api/upload-louvor responde 503 (falha fechada).
